<header class="site-header">
    <!-- Логотип слева -->
    <a href="/" class="header-logo">SLibs</a>

    <!-- 🔍 ПОИСК В ШАПКЕ (Только если show_search=True) -->
    {% if show_search %}
    <form action="/find" method="GET" class="header-search-form">
        <input type="text" name="q" value="{{ query or '' }}" placeholder="Новый поиск..." class="header-search-input">
        <button type="submit" class="header-search-btn">Найти</button>
    </form>
    {% endif %}

    <div class="header-user-nav">
        {% if session.get('user') %}

        <!-- ИНФОРМАЦИЯ О ПОЛЬЗОВАТЕЛЕ -->
            <div class="avatar-wrapper">
                <img src="{{ session['user'].get('picture') or 'https://via.placeholder.com/36' }}"
                     alt="Profile"
                     class="user-avatar"
                     onclick="document.getElementById('user-dropdown').style.display = document.getElementById('user-dropdown').style.display === 'block' ? 'none' : 'block'">
                <!-- Выпадающее меню (скрыто по умолчанию) -->
                <div id="user-dropdown" class="user-dropdown">
                    <div class="dropdown-info">
                        <p class="dropdown-name">{{ session['user']['name'] }}</p>
                        <p class="dropdown-email">{{ session['user']['email'] }}</p>
                    </div>
                    <a href="/logout" class="btn-logout">Выйти</a>
                </div>
            </div>
        {% else %}
            <!-- КНОПКА ВХОДА (если не вошёл) -->
            <a href="/login" class="btn-login-header">Войти через Google</a>
        {% endif %}
    </div>
</header>

<script>
    window.onclick = function(event) {
        if (!event.target.matches('.user-avatar')) {
            var dropdown = document.getElementById('user-dropdown');
            if (dropdown && dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            }
        }
    }
</script>

<!-- МОЯ БИБЛИОТЕКА -->
<!-- Кнопка перехода -->
<div id="library-fab" title="Моя библиотека">
    📜
    <span id="library-count">0</span>
</div>

<!-- 2. Панель моей библиотеки -->
<div id="library-drawer">
    <div class="drawer-header">
        <h2>Моя библиотека</h2>
        <button id="close-drawer">✕</button>
    </div>
    <!-- Список моих книг -->
    <div id="library-list"></div>
</div>

<!-- Затемнение фона -->
<div id="drawer-overlay"></div>

<!-- ШТОРКА -->
<!-- ШТОРКА -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fab = document.getElementById('library-fab');
        const drawer = document.getElementById('library-drawer');
        const overlay = document.getElementById('drawer-overlay');
        const closeBtn = document.getElementById('close-drawer');
        const countBadge = document.getElementById('library-count');
        const listContainer = document.getElementById('library-list');

        if (!fab || !drawer || !overlay || !closeBtn || !countBadge || !listContainer) {
            console.warn('⚠️ Элементы библиотеки не найдены. Проверь HTML.');
            return;
        }

        // 🔹 НОВАЯ ФУНКЦИЯ: Загружает книги с сервера (из БД)
        function loadLibrary() {
            fetch('/api/get-books', {
                method: 'GET',
                credentials: 'include' // Передаёт куки сессии, чтобы сервер узнал тебя
            })
            .then(res => res.json())
            .then(data => {
                renderLibrary(data.books); // Передаём список книг в отрисовку
                updateCount(data.books.length);
            })
            .catch(err => {
                console.error('Ошибка загрузки библиотеки:', err);
                listContainer.innerHTML = '<p class="library-empty">❌ Не удалось загрузить книги</p>';
            });
        }

        function updateCount(count) {
            countBadge.textContent = count;
            countBadge.style.display = count > 0 ? 'flex' : 'none';
        }

        // 🔹 НОВАЯ ФУНКЦИЯ: Отрисовывает список книг (принимает массив из БД)
        function renderLibrary(books) {
            if (!books || books.length === 0) {
                listContainer.innerHTML = '<p class="library-empty">Тут пока пусто. Добавь книги через поиск</p>';
                return;
            }
            listContainer.innerHTML = books.map(book => `
                <div class="library-item">
                    <strong>${book.title}</strong>
                    ${book.author ? `<br><small class="library-author">${book.author}</small>` : ''}
                    <br><a href="${book.link}" target="_blank" class="library-link">🔗 Открыть</a>
                </div>
            `).join('');
        }

        // Открытие панели: загружаем свежие данные из БД
        fab.addEventListener('click', () => {
            drawer.classList.add('open');
            overlay.style.display = 'block';
            loadLibrary(); // 🔹 Запрос к серверу при каждом открытии
        });

        function closeDrawer() {
            drawer.classList.remove('open');
            overlay.style.display = 'none';
        }
        closeBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);

        // 🔹 ГЛОБАЛЬНАЯ ФУНКЦИЯ СОХРАНЕНИЯ (теперь доступна на всех страницах)
        window.addToLibrary = function(bookData) {
            fetch('/api/save-book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    title: bookData.title,
                    author: bookData.author,
                    link: bookData.link
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('✅ Книга сохранена в базу данных!');
                    // Если панель библиотеки открыта — обновим её сразу
                    if (document.getElementById('library-drawer').classList.contains('open')) {
                        loadLibrary();
                    }
                } else {
                    alert('❌ Ошибка: ' + (data.error || 'Не удалось сохранить'));
                }
            })
            .catch(err => {
                console.error('Ошибка:', err);
                alert('❌ Ошибка соединения с сервером');
            });
        };

        // Анимация (оставляем как есть, она визуальная)
        function animateBookFly(clickEvent) {
            const flyingBook = document.createElement('div');
            flyingBook.className = 'flying-book';
            flyingBook.textContent = '📚';
            document.body.appendChild(flyingBook);
            const startRect = clickEvent.target.getBoundingClientRect();
            const endRect = fab.getBoundingClientRect();
            flyingBook.style.left = (startRect.left + startRect.width / 2) + 'px';
            flyingBook.style.top = (startRect.top + startRect.height / 2) + 'px';

            setTimeout(() => {
                flyingBook.style.left = (endRect.left + endRect.width / 2) + 'px';
                flyingBook.style.top = (endRect.top + endRect.height / 2) + 'px';
                flyingBook.style.transform = 'scale(0.5)';
                flyingBook.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                flyingBook.remove();
            }, 850);

            countBadge.classList.add('count-animate');
            setTimeout(() => {
                countBadge.classList.remove('count-animate');
            }, 300);
        }
        window.animateBookFly = animateBookFly;

        // Убираем старую removeFromLibrary, так как удаление из БД — отдельная фича
        // Если нужно удаление, добавим маршрут /api/delete-book позже
    });
</script>
